<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thamudi</title>
  <link rel="stylesheet" href="style.css">
</head>

<body onmousemove="mouseEvent(event)">
  <div style="display: flex; flex-direction: column; gap: 24px; width: min(700px, calc(100vw - 40px));">

    <div id="canvasContainer" style="position: relative; width: 100%; aspect-ratio: 1;">
      <canvas id="baseCanvas" style="position: absolute; width: 100%; height: 100%;">
        :(
      </canvas>
      <canvas id="overlayCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
        :(
      </canvas>
      <canvas id="traceOverlayCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
        :(
      </canvas>
    </div>
    <div class="header" style="text-align: center;">
      <h6>
        <a href="https://github.com/thamudi">
          Thamudi
        </a>
      </h6>
    </div>
  </div>
  <script src="canvas.js"></script>
</body>

</html>
