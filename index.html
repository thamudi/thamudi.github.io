<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thamudi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    a {
      color: black;

    }

    a.dark {
      color: white;
    }

    a:hover {
      color: #4A9EE8
    }

    body.dark {
      background: #111111;
      color: #ffffff;
    }
  </style>
</head>

<body onmousemove="mouseEvent(event)">
  <div style="display: flex; flex-direction: column; gap: 24px; width: min(700px, calc(100vw - 40px));">

    <div id="canvasContainer" style="position: relative; width: 100%; aspect-ratio: 1;">
      <canvas id="baseCanvas" style="position: absolute; width: 100%; height: 100%;">
        Sorry, your browser does not support canvas.
      </canvas>
      <canvas id="overlayCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
        Sorry, your browser does not support canvas.
      </canvas>
      <canvas id="traceOverlayCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
        Sorry, your browser does not support canvas.
      </canvas>
    </div>
    <div class="header" style="text-align: center;">
      <h6>
        <a href="https://github.com/thamudi">
          Thamudi
        </a>
      </h6>
    </div>
  </div>

  <script>
    const container = document.getElementById("canvasContainer");

    const baseCanvas = document.getElementById("baseCanvas");
    const baseCtx = baseCanvas.getContext("2d");

    const overlayCanvas = document.getElementById("overlayCanvas");
    const overlayCtx = overlayCanvas.getContext("2d");

    const traceOverlayCanvas = document.getElementById("traceOverlayCanvas");
    const traceOverlayCtx = traceOverlayCanvas.getContext("2d");

    const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");

    const theme = () => ({
      bg: darkMQ.matches ? "#111111" : "#ffffff",
      stroke: darkMQ.matches ? "#ffffff" : "#000000",
      highlight: "blue",
    });

    const applyTheme = () => {
      document.body.classList.toggle("dark", darkMQ.matches);
    };

    applyTheme();
    darkMQ.addEventListener("change", () => {
      applyTheme();
      redrawAll();
    });

    const resizeCanvases = () => {
      const size = container.offsetWidth;
      [baseCanvas, overlayCanvas, traceOverlayCanvas].forEach(c => {
        c.width = size;
        c.height = size;
      });
    };

    resizeCanvases();

    let isDrawing = false;
    let mouseX = 0;
    let mouseY = 0;

    const drawRectangle = (w, h, x, y, ctx, color = theme().stroke, lineWidth = 2) => {
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.rect(x, y, w, h);
      ctx.stroke();
    }

    const drawCircle = (i, ctx) => {
      ctx.beginPath();
      ctx.lineWidth = 2;
      ctx.arc(130 * i, 130, 25, 0, 2 * Math.PI);
      ctx.stroke();
    }

    const width = 60;
    const height = 60;
    const x = 100;
    const y = 100;

    const gridCount = () => Math.max(1, Math.floor((baseCanvas.width - width) / x));

    const drawBaseCanvas = () => {
      baseCtx.clearRect(0, 0, baseCanvas.width, baseCanvas.height);
      const count = gridCount();
      for (let i = 1; i <= count; i++) {
        for (let j = 1; j <= count; j++) {
          drawRectangle(width, height, x * i, y * j, baseCtx);
        }
      }
    }

    const drawOverlayCanvas = (mouseX, mouseY) => {
      const count = gridCount();
      for (let i = 1; i <= count; i++) {
        for (let j = 1; j <= count; j++) {
          if (Math.random() > 0.5 && !(mouseX > x * i && mouseX < x * i + width && mouseY > y * j && mouseY < y * j + height)) {
            drawRectangle(
              width / 1.2,
              height / 1.2,
              x * i + width / 12,
              y * j + height / 12,
              overlayCtx
            );
          }
        }
      }
    }

    const drawTraceOverlayCanvas = (mouseX, mouseY) => {
      const count = gridCount();
      for (let i = 1; i <= count; i++) {
        for (let j = 1; j <= count; j++) {
          if (mouseX > x * i && mouseX < x * i + width &&
            mouseY > y * j && mouseY < y * j + height) {
            drawRectangle(
              width / 1.2,
              height / 1.2,
              x * i + width / 12,
              y * j + height / 12,
              traceOverlayCtx,
              "#4A9EE8",
              4
            );
          }
        }
      }
    }

    const redrawAll = () => {
      drawBaseCanvas();
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      drawOverlayCanvas(mouseX, mouseY);
      traceOverlayCtx.clearRect(0, 0, traceOverlayCanvas.width, traceOverlayCanvas.height);
      drawTraceOverlayCanvas(mouseX, mouseY);
    };

    drawBaseCanvas();

    window.addEventListener("resize", () => {
      resizeCanvases();
      redrawAll();
    });

    setInterval(() => {
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      drawOverlayCanvas(mouseX, mouseY);
    }, 1000);

    const mouseEvent = (event) => {
      if (isDrawing) return;
      isDrawing = true;
      traceOverlayCtx.clearRect(0, 0, traceOverlayCanvas.width, traceOverlayCanvas.height);
      mouseX = event.offsetX;
      mouseY = event.offsetY;

      drawTraceOverlayCanvas(mouseX, mouseY);
      isDrawing = false;
    }


  </script>
</body>

</html>
